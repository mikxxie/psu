name: Build PSU

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: alpine:3.24

    steps:
      - name: Install build dependencies
        run: |
          apk update
          apk add --no-cache \
            build-base \
            curl-dev \
            git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PSU
        run: |
          make clean
          make

      - name: Verify binary
        run: |
          file ./psu
          ldd ./psu
          ./psu 2>/dev/null || true

      - name: Upload PSU
        uses: actions/upload-artifact@v4
        with:
          name: psu-aarch64-alpine
          path: ./psu
