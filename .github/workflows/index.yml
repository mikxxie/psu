name: Build PSU

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Alpine
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD:/src" \
            -w /src \
            alpine:3.24 \
            sh -c '
              apk update &&
              apk add --no-cache build-base curl-dev file &&
              make clean &&
              make &&
              file ./psu &&
              ldd ./psu
            '

      - name: Upload PSU
        uses: actions/upload-artifact@v4
        with:
          name: psu-aarch64-alpine
          path: ./psu
