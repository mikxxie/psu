name: Build PSU

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Alpine
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD:/src" \
            -w /src \
            alpine:3.24 \
            sh -euxc '
              echo "=== Alpine ==="
              cat /etc/alpine-release
              uname -m

              echo "=== Network ==="
              wget -qO- https://dl-cdn.alpinelinux.org/alpine/v3.24/main/aarch64/APKINDEX.tar.gz >/dev/null
              echo "Network OK"

              echo "=== Installing dependencies ==="
              apk add --no-cache build-base curl-dev file
              echo "Dependencies OK"

              echo "=== Building PSU ==="
              make clean
              make
              echo "Build OK"

              echo "=== Binary ==="
              file ./psu
              ldd ./psu
            '

      - name: Upload PSU
        uses: actions/upload-artifact@v4
        with:
          name: psu-aarch64-alpine
          path: ./psu
